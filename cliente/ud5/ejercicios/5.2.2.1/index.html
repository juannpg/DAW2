<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img src="src/te vienes a liarla un poco.png" id="imagen" alt="" />
    <script>
      const img = document.getElementById("imagen");

      const handleCambiar = (source) => {
        img.src = source;
      };

      img.addEventListener("mouseover", () =>
        handleCambiar("src/tic tac tic tac.png")
      );
      img.addEventListener("mouseout", () =>
        handleCambiar("src/te vienes a liarla un poco.png")
      );
    </script>
  </body>
</html>
